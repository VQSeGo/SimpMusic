name: Release

# A tag like v2.5.0-1 builds the phone APKs, the Linux AppImage and the Windows installer and publishes
# them as a GitHub release. Run by hand it only leaves them as run artifacts; the button shows up only
# while this file is on the repository's default branch.
#
# Secrets: SIGNING_KEY (keystore in base64), ALIAS, KEY_STORE_PASSWORD, KEY_PASSWORD and
# CONVEYOR_SIGNING_KEY. The Windows certificate derives from the last one, so keep it the same.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Create local.properties
        run: touch local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease

      - name: Find build tools
        run: echo "BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)" >> $GITHUB_ENV

      - uses: kevin-david/zipalign-sign-android-release@v2
        with:
          releaseDirectory: androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Name the APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*arm64-v8a*-signed.apk dist/SimpMusic-arm64.apk
          cp androidApp/build/outputs/apk/release/*universal*-signed.apk dist/SimpMusic-universal.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Install libfuse2
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Create local.properties
        run: touch local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      # Conveyor runs from its own action, not through Gradle, so nothing stages the natives for it.
      - name: Populate mpv-natives
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Run Conveyor (linux-app)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: -Kapp.machines=linux.amd64.glibc make linux-app
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Wrap the Linux app into an AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      # Wipes output/, which is why the AppImage is only copied in afterwards.
      - name: Run Conveyor (make site, Windows)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=[windows.amd64] make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      # install.bat trusts the certificate and sideloads the msix: without that Windows refuses it.
      - name: Bundle the Windows installer
        run: |
          set -euo pipefail
          ls -lh output/
          mkdir -p dist stage
          cp desktopApp/build/appimage/conveyor/SimpMusic-*.AppImage dist/SimpMusic-x86_64.AppImage
          cp scripts/windows/install.bat output/simpmusic.crt output/simpmusic-*.x64.msix stage/
          ( cd stage && zip -q -j ../dist/SimpMusic-Windows-installer.zip ./* )
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SimpMusic $GITHUB_REF_NAME" \
            --notes "Android: SimpMusic-arm64.apk (universal, if that one does not install). Windows: unzip SimpMusic-Windows-installer.zip and run install.bat. Linux: SimpMusic-x86_64.AppImage."
